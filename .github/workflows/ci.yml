name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Tests (Always runs)
        run: npm test -- --watch=false
        
      - name: Verify Build (Pull Requests Only)
        if: github.event_name == 'pull_request'
        run: npm run build
        
      - name: Build & Deploy to Azure (Main Branch Only)
        if: github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/" 
          output_location: "dist/dev-news/browser"